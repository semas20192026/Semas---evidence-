<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEMAS — Evidence Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#1c2430; --muted:#6b7686; --line:#e3e7ee; --bg:#f6f7fa; --brand:#1c4b8c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  #app{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  .notice{max-width:560px;margin:60px auto;text-align:center;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .head h1{margin:0 0 6px;font-size:20px}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{background:#eef2f8;color:var(--brand);font-size:11px;padding:2px 8px;border-radius:20px}
  .desc{color:var(--muted);font-size:13px;margin:8px 0}
  .score{font-size:13px;font-weight:600;margin-bottom:8px}
  .evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
  .evitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfc}
  .evitem img,.evitem video{width:100%;height:110px;object-fit:cover;display:block}
  .evitem .cap{font-size:11px;color:var(--muted);padding:6px 8px}
  .evitem .loading,.evitem .missing{padding:30px 8px;text-align:center;color:var(--muted);font-size:12px}
  .docbox{display:block;padding:20px 8px;text-align:center;font-size:12px;text-decoration:none;color:var(--ink)}
  .muted{color:var(--muted);font-size:13px}
  a{color:var(--brand)}
</style>
</head>
<body>
<div id="app"><div class="notice">Loading evidence…</div></div>

<script>
/* SETUP: use the SAME values as the main SEMAS app's SUPABASE_URL /
   SUPABASE_ANON_KEY (they must point at the same project so this page
   can see the same data). */
const SUPABASE_URL = "https://lruiaipbainuwkgjlisd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_79gr8uIi3DfeKSIPulKqYg_6lshXHwg";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Matches the sanitizing the main app applies when building a code, so
// codes compare equal regardless of how spacing/casing was typed.
function norm(x){ return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g, ""); }

function showNotice(msg){
  document.getElementById("app").innerHTML = `<div class="notice">${msg}</div>`;
}

/* Paged the same way as the main app's storage layer — a single
   request from Supabase caps out at 1000 rows, so a school with more
   than that many students/marks/evidence records would otherwise
   silently miss whatever comes after row 1000. */
async function fetchAll(table){
  const pageSize = 1000;
  let all = [];
  let from = 0;
  while(true){
    const { data, error } = await sb.from(table).select("id,data").range(from, from + pageSize - 1);
    if(error) throw new Error(table + ": " + error.message);
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all.map(r => Object.assign({id:r.id}, r.data));
}

function activityMaxScore(activity){
  return (activity.parts && activity.parts.length) ? activity.parts.reduce((s,p)=>s+(Number(p.maxScore)||0),0) : (activity.maxScore||0);
}
function activityScoreForScope(activity, scopeType, scopeId, milestoneId, scores){
  milestoneId = milestoneId || "";
  const match = x => x.activityId===activity.id && (x.milestoneId||"")===milestoneId && x.scopeType===scopeType && x.scopeId===scopeId;
  if(activity.parts && activity.parts.length){
    let total = 0, any = false;
    activity.parts.forEach(part=>{
      const sc = scores.find(x=>match(x) && x.partId===part.id);
      if(sc && sc.score!==undefined){ any = true; total += sc.score; }
    });
    return any ? total : undefined;
  }
  const sc = scores.find(x=>match(x) && !x.partId);
  return sc && sc.score!==undefined ? sc.score : undefined;
}

async function main(){
  if(SUPABASE_URL.indexOf("YOUR-PROJECT") !== -1 || SUPABASE_ANON_KEY.indexOf("YOUR-ANON-KEY") !== -1){
    showNotice("This page hasn't been set up yet — SUPABASE_URL / SUPABASE_ANON_KEY at the top of evidence.html still have their placeholder values. Contact the school to have this fixed.");
    return;
  }
  const params = new URLSearchParams(location.search);
  const code = (params.get("code") || "").trim();
  if(!code){ showNotice("No evidence code was given. Check the link you were sent."); return; }

  const parts = code.split("-");
  if(parts.length !== 5){ showNotice("This evidence link looks malformed. Please check it with the school."); return; }
  const [assNoCode, schoolCode, subjCode, formCode, yearStr] = parts;
  const year = parseInt(yearStr, 10);

  const [subjects, projects, students] = await Promise.all([
    fetchAll("subjects"), fetchAll("projects"), fetchAll("students")
  ]);

  const subject = subjects.find(s => norm(s.code) === subjCode);
  if(!subject){ showNotice("Couldn't find a matching subject for this link."); return; }

  const project = projects.find(p =>
    p.subjectId === subject.id && norm(p.form) === formCode && Number(p.year) === year
  );
  if(!project){ showNotice("Couldn't find a matching project for this link."); return; }

  const student = students.find(s => norm(s.assessmentNo || s.admNo || s.indexNo) === assNoCode);
  if(!student){ showNotice("Couldn't find a matching learner for this link."); return; }

  let scopeType, scopeId, scopeLabel;
  if(project.mode === "group"){
    const groups = (await fetchAll("project_groups")).filter(g => g.projectId === project.id);
    const grp = groups.find(g => (g.studentIds||[]).includes(student.id));
    if(!grp){ showNotice(esc(student.name) + " is not part of a group in this project."); return; }
    scopeType = "group"; scopeId = grp.id; scopeLabel = grp.name;
  } else {
    scopeType = "student"; scopeId = student.id; scopeLabel = student.name;
  }

  const [allActivities, allMilestones, allEvidence, allScores] = await Promise.all([
    fetchAll("project_activities"), fetchAll("project_milestones"),
    fetchAll("project_evidence"), fetchAll("project_scores")
  ]);
  const activities = allActivities.filter(a => a.projectId === project.id && (!a.groupId || a.groupId === scopeId));
  const milestones = allMilestones.filter(m => m.projectId === project.id)
    .sort((a,b) => (a.order||0) - (b.order||0));

  const instances = [];
  activities.forEach(a => {
    if(a.scope === "single"){
      instances.push({ activity:a, milestoneId: a.milestoneId||"", milestoneName: (milestones.find(m=>m.id===a.milestoneId)||{}).name || null });
    } else if(milestones.length){
      milestones.forEach(m => instances.push({ activity:a, milestoneId:m.id, milestoneName:m.name }));
    } else {
      instances.push({ activity:a, milestoneId:"", milestoneName:null });
    }
  });

  const app = document.getElementById("app");
  let html = `<div class="head">
      <h1>${esc(project.title)}</h1>
      <div class="meta">${esc(subject.name)} &middot; ${esc(project.form)} &middot; ${esc(project.year)}</div>
      <div class="meta">${project.mode==='group' ? 'Group' : 'Learner'}: <b>${esc(scopeLabel)}</b>${project.mode==='group' ? '' : ' &middot; Adm No: ' + esc(student.admNo||'')}</div>
    </div>`;

  if(instances.length === 0){
    html += `<div class="card muted">No activities recorded for this project yet.</div>`;
  } else {
    instances.forEach((inst, i) => {
      const a = inst.activity;
      const max = activityMaxScore(a);
      const total = activityScoreForScope(a, scopeType, scopeId, inst.milestoneId, allScores);
      html += `<div class="card">
        <div class="card-head"><b>${esc(a.title)}</b>${inst.milestoneName ? `<span class="badge">${esc(inst.milestoneName)}</span>` : ''}</div>
        <p class="desc">${esc(a.description||"")}</p>
        <div class="score">Score: ${total!==undefined ? total : "—"} / ${max}</div>
        <div class="evgrid" id="grid-${i}"><div class="muted">Loading evidence…</div></div>
      </div>`;
    });
  }
  app.innerHTML = html;

  for(let i = 0; i < instances.length; i++){
    const inst = instances[i];
    const grid = document.getElementById("grid-" + i);
    if(!grid) continue;
    const rec = allEvidence.find(e => e.activityId===inst.activity.id && (e.milestoneId||"")===inst.milestoneId && e.scopeType===scopeType && e.scopeId===scopeId);
    const items = rec ? (rec.items||[]) : [];
    if(!items.length){ grid.innerHTML = '<div class="muted">No evidence uploaded yet.</div>'; continue; }
    grid.innerHTML = "";
    for(const ev of items){
      const el = document.createElement("div");
      el.className = "evitem";
      el.innerHTML = '<div class="loading">…</div>';
      grid.appendChild(el);
      try{
        const { data: blob, error } = await sb.storage.from("evidence").download(ev.id);
        if(error || !blob) throw error || new Error("missing file");
        const url = URL.createObjectURL(blob);
        if(ev.type === "video"){
          el.innerHTML = `<video src="${url}" controls></video><div class="cap">${esc(ev.caption||ev.fileName||"")}</div>`;
        } else if(ev.type === "photo"){
          el.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="evidence"></a><div class="cap">${esc(ev.caption||ev.fileName||"")}</div>`;
        } else {
          el.innerHTML = `<a class="docbox" href="${url}" download="${esc(ev.fileName||'document')}">📄 ${esc(ev.fileName||"Document")}</a><div class="cap">${esc(ev.caption||"")}</div>`;
        }
      }catch(e){
        el.innerHTML = '<div class="missing">File unavailable</div>';
      }
    }
  }
}

main().catch(e => {
  console.error(e);
  showNotice("Something went wrong loading this evidence link: " + esc(e && e.message ? e.message : "unknown error") + ". If this keeps happening, contact the school with this exact message.");
});
</script>
</body>
</html>
